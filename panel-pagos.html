<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Pagos — Nexus/Vertex</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#000000;
    --panel:#141414;
    --panel-2:#1d1d1d;
    --cyan:#00f2ea;
    --pink:#fe2c55;
    --white:#ffffff;
    --gray:#9a9a9a;
    --green:#28d17c;
    --red:#ff4d4d;
    --border:#2a2a2a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--white);
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    font-size:17px; line-height:1.4;
  }
  a{color:var(--cyan);}
  .hidden{display:none !important;}

  /* ---------- Layout ---------- */
  header{
    display:flex; align-items:center; gap:16px;
    padding:14px 20px; border-bottom:3px solid;
    border-image:linear-gradient(90deg,var(--cyan),var(--pink)) 1;
    position:sticky; top:0; background:var(--bg); z-index:50;
    flex-wrap:wrap;
  }
  header h1{font-size:20px; margin:0; color:var(--cyan); white-space:nowrap;}
  header .who{font-size:13px; color:var(--gray);}
  #searchBox{flex:1; min-width:220px; position:relative;}
  #searchInput{
    width:100%; padding:12px 14px; font-size:17px;
    background:var(--panel); border:2px solid var(--border); border-radius:10px;
    color:var(--white);
  }
  #searchInput:focus{border-color:var(--cyan); outline:none;}
  #searchResults{
    position:absolute; top:110%; left:0; right:0;
    background:var(--panel-2); border:2px solid var(--cyan); border-radius:10px;
    max-height:340px; overflow-y:auto; z-index:100;
  }
  .searchItem{padding:10px 14px; border-bottom:1px solid var(--border); cursor:pointer;}
  .searchItem:hover{background:#242424;}
  .searchItem b{color:var(--cyan);}
  .searchItem .meta{font-size:13px; color:var(--gray);}
  .badge-noshow{color:var(--pink); font-weight:bold;}

  main{padding:20px; max-width:1200px; margin:0 auto;}

  /* ---------- Login gate ---------- */
  #gate{
    max-width:420px; margin:80px auto; padding:28px;
    background:var(--panel); border-radius:14px; border:2px solid var(--border);
  }
  #gate h2{color:var(--cyan); margin-top:0;}
  #gate input{
    width:100%; padding:12px; font-size:17px; margin:10px 0;
    background:#0a0a0a; border:2px solid var(--border); border-radius:8px; color:var(--white);
  }
  .btn{
    background:linear-gradient(135deg,var(--cyan),var(--pink));
    color:#000; border:none; padding:12px 20px; border-radius:8px;
    font-weight:bold; font-size:16px; cursor:pointer;
  }
  .btn:hover{filter:brightness(1.1);}
  .btn-secondary{background:var(--panel-2); color:var(--white); border:2px solid var(--border);}
  .btn-danger{background:var(--red); color:#fff;}
  #gateError{color:var(--pink); font-weight:bold; margin-top:8px;}

  /* ---------- Sections nav (admin) ---------- */
  .sections{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap;}
  .sectionTab{
    padding:10px 18px; border-radius:8px; border:2px solid var(--border);
    background:var(--panel); cursor:pointer; font-weight:bold;
  }
  .sectionTab.active{border-color:var(--cyan); color:var(--cyan);}
  .contractGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px;}
  .contractCard{
    background:var(--panel); border:2px solid var(--border); border-radius:10px;
    padding:14px; cursor:pointer;
  }
  .contractCard:hover{border-color:var(--pink);}
  .contractCard .code{font-size:20px; font-weight:bold; color:var(--cyan);}
  .contractCard .name{font-size:14px; color:var(--gray);}
  .pairDivider{
    grid-column:1/-1; text-align:center; color:var(--gray); font-size:13px;
    border-top:1px dashed var(--border); margin:4px 0; padding-top:6px;
  }

  /* ---------- Contract / table view ---------- */
  .topBar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  select{
    background:var(--panel); color:var(--white); border:2px solid var(--border);
    border-radius:8px; padding:8px 12px; font-size:15px;
  }
  table{width:100%; border-collapse:collapse; background:var(--panel); border-radius:10px; overflow:hidden;}
  th,td{padding:10px; border-bottom:1px solid var(--border); text-align:center; font-size:15px;}
  th{background:var(--panel-2); color:var(--cyan); text-transform:uppercase; font-size:12px; letter-spacing:.5px;}
  tr.userRow:hover{background:#1a1a1a; cursor:pointer;}
  .payToggle{
    display:inline-flex; align-items:center; gap:6px; padding:6px 10px;
    border-radius:20px; border:2px solid var(--border); cursor:pointer; font-weight:bold; font-size:13px;
  }
  .pay-yes{border-color:var(--green); color:var(--green);}
  .pay-no{border-color:var(--gray); color:var(--gray);}
  .pay-locked{border-color:var(--border); color:#555; cursor:not-allowed;}
  .histBadge{font-size:11px; color:var(--gray); text-transform:uppercase;}

  /* ---------- Drilldown modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.75); display:flex;
    align-items:center; justify-content:center; z-index:200; padding:16px;
  }
  .modal{
    background:var(--panel); border:2px solid var(--cyan); border-radius:14px;
    max-width:800px; width:100%; max-height:85vh; overflow-y:auto; padding:22px;
  }
  .modal h3{color:var(--cyan); margin-top:0;}
  .modalActions{display:flex; gap:10px; justify-content:flex-end; margin-top:18px;}
  .closeX{float:right; cursor:pointer; font-size:22px; color:var(--gray);}
  .errBox{background:#3a1414; border:2px solid var(--red); color:#ffb3b3; padding:12px; border-radius:8px; margin:10px 0;}
  .okBox{background:#12331f; border:2px solid var(--green); color:#a3f2c4; padding:12px; border-radius:8px; margin:10px 0;}
  .loading{color:var(--gray); font-style:italic;}
  .smallNote{font-size:13px; color:var(--gray);}
</style>
</head>
<body>

<!-- ============ LOGIN GATE ============ -->
<div id="gate">
  <h2>🔐 Panel de Pagos</h2>
  <p class="smallNote">Entra con tu token (admin o de contrato). Si tienes el link con <code>?token=</code> ya te lo llena solo.</p>
  <input id="tokenInput" placeholder="Pega tu token aquí" autocomplete="off">
  <button class="btn" onclick="intentarLogin()">Entrar</button>
  <div id="gateError"></div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header>
    <h1>📊 Panel de Pagos</h1>
    <span class="who" id="whoAmI"></span>
    <div id="searchBox">
      <input id="searchInput" placeholder="Buscar por ID o @usuario (A o B, cualquier periodo)...">
      <div id="searchResults" class="hidden"></div>
    </div>
    <button class="btn btn-secondary" onclick="cerrarSesion()">Salir</button>
  </header>

  <main>
    <div id="errGlobal"></div>

    <!-- Secciones (solo admin) -->
    <div id="seccionesWrap" class="hidden">
      <div class="sections" id="sectionTabs"></div>
      <div class="contractGrid" id="contractGrid"></div>
    </div>

    <!-- Vista de contrato -->
    <div id="contractView" class="hidden">
      <div class="topBar">
        <div>
          <button class="btn btn-secondary" onclick="volverASecciones()" id="btnVolver">← Volver</button>
          <button class="btn btn-secondary" onclick="abrirContrato(ESTADO.contratoPropio)" id="btnVolverPropio" style="display:none; margin-left:8px;">⬆ Volver a mi contrato</button>
          <b id="contractTitle" style="font-size:20px; color:var(--cyan); margin-left:10px;"></b>
        </div>
        <div>
          <label class="smallNote">Periodo:</label>
          <select id="periodoSelect" onchange="cargarPeriodo(this.value)"></select>
        </div>
      </div>
      <div id="tablaWrap" class="loading">Cargando...</div>
    </div>
  </main>
</div>

<!-- ============ MODALS ============ -->
<div id="modalOverlay" class="overlay hidden"></div>

<script>
// ================================================================
// CONFIG — ajusta aquí si algo no cuadra con el schema real
// ================================================================
const SUPABASE_URL = "https://lequmcmudzzilxlessoz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxlcXVtY211ZHp6aWx4bGVzc296Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkxMjkxMzIsImV4cCI6MjA3NDcwNTEzMn0.iTWmbHgkmWLGGUhT0pdN_FtaE0S4J9ZWXKyRD3m8FFM";
const AÑO_MINIMO_PAGOS = 2026; // <- regla: solo 2026 en adelante se puede marcar

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ================================================================
// ESTADO GLOBAL
// ================================================================
let ESTADO = {
  token: null,
  tipo: null,        // 'admin' | 'contrato'
  contrato: null,    // código si es manager
  nombreDisplay: null,
  contratosTodos: [],       // filas crudas de usuarios_tiktok distinct contrato
  paresSet: new Set(),      // códigos que están en contratos_equivalencias
  equivMap: {},             // código -> código pareja
  seccionActiva: 'pares',
  contratoAbierto: null,
  contratoPropio: null,      // contrato del manager logueado, para "volver a mi contrato"
  subordinadosActuales: [],  // contratos que reportan al contrato abierto ahora
  periodoActual: null
};

// ================================================================
// UTILIDADES
// ================================================================
function periodoKeyDe(row){
  return row.fecha_periodo || row.fecha_datos || row.periodo_archivo || null;
}
function esPeriodoMarcable(periodoStr){
  if(!periodoStr) return false;
  const year = parseInt(String(periodoStr).slice(0,4), 10);
  return year >= AÑO_MINIMO_PAGOS;
}
function fmtFecha(f){
  if(!f) return '—';
  try{
    // Parseo manual para evitar que new Date("YYYY-MM-DD") lo lea como UTC
    // y se recorra un dia hacia atras en zonas horarias negativas (ej. Merida, UTC-6)
    const [y, m, d] = String(f).slice(0,10).split('-').map(Number);
    const dt = new Date(y, m - 1, d); // fecha local, sin shift de UTC
    return dt.toLocaleDateString('es-MX', {year:'numeric', month:'short', day:'numeric'});
  }catch(e){ return f; }
}
function fmtMoney(v){
  if(v===null||v===undefined) return '$0.00';
  return '$' + Number(v).toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function esSerieB(codigo){
  return /^B/i.test(String(codigo||''));
}

// Supabase regresa max 1000 filas por default -- esto pagina hasta traer todo
async function fetchAllPaged(table, selectStr, applyFilters){
  let all = [];
  let from = 0;
  const pageSize = 1000;
  while(true){
    let q = sb.from(table).select(selectStr).range(from, from + pageSize - 1);
    if(applyFilters) q = applyFilters(q);
    const { data, error } = await q;
    if(error) throw error;
    if(!data || data.length === 0) break;
    all = all.concat(data);
    if(data.length < pageSize) break;
    from += pageSize;
  }
  return all;
}
function mostrarErrorGlobal(msg){
  document.getElementById('errGlobal').innerHTML =
    `<div class="errBox">⚠️ ${msg}</div>`;
}
function limpiarErrorGlobal(){
  document.getElementById('errGlobal').innerHTML = '';
}

// ================================================================
// LOGIN
// ================================================================
window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const tokenURL = params.get('token');
  if(tokenURL){
    document.getElementById('tokenInput').value = tokenURL;
    intentarLogin();
  }
});

async function intentarLogin(){
  const token = document.getElementById('tokenInput').value.trim();
  const errBox = document.getElementById('gateError');
  errBox.textContent = '';
  if(!token){
    errBox.textContent = 'Pega un token primero.';
    return;
  }

  try{
    const { data, error } = await sb
      .from('contratos_tokens')
      .select('*')
      .eq('token', token)
      .eq('activo', true);

    if(error){
      errBox.textContent = 'Error consultando contratos_tokens: ' + error.message;
      return;
    }
    if(!data || data.length === 0){
      errBox.textContent = 'Token inválido o inactivo.';
      return;
    }

    const rowToken = data[0];
    ESTADO.token = token;
    ESTADO.tipo = rowToken.tipo === 'admin' ? 'admin' : 'contrato';
    ESTADO.contrato = rowToken.contrato || null;
    ESTADO.contratoPropio = rowToken.contrato || null; // para "volver a mi contrato" tras ver subordinados
    ESTADO.nombreDisplay = rowToken.nombre_display || rowToken.contrato || 'Manager';

    document.getElementById('gate').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('whoAmI').textContent =
      ESTADO.tipo === 'admin' ? '👑 Admin' : `👔 ${ESTADO.nombreDisplay}`;

    await iniciarApp();
  }catch(e){
    errBox.textContent = 'Error inesperado: ' + e.message;
  }
}

function cerrarSesion(){
  ESTADO = { token:null, tipo:null, contrato:null, nombreDisplay:null,
    contratosTodos:[], paresSet:new Set(), equivMap:{}, seccionActiva:'pares',
    contratoAbierto:null, contratoPropio:null, subordinadosActuales:[], periodoActual:null };
  document.getElementById('app').classList.add('hidden');
  document.getElementById('gate').classList.remove('hidden');
  document.getElementById('tokenInput').value = '';
  history.replaceState(null, '', window.location.pathname);
}

// ================================================================
// INICIO DE APP — carga contratos reales + equivalencias
// ================================================================
async function iniciarApp(){
  limpiarErrorGlobal();

  if(ESTADO.tipo === 'admin'){
    document.getElementById('seccionesWrap').classList.remove('hidden');
    await cargarContratosYEquivalencias();
    renderSecciones();
  } else {
    // Manager: va directo a su contrato, sin secciones
    document.getElementById('seccionesWrap').classList.add('hidden');
    await abrirContrato(ESTADO.contrato);
  }
}

async function cargarContratosYEquivalencias(){
  // 1) Contratos reales: distinct 'contrato' desde usuarios_tiktok, PERO solo
  //    los que tienen actividad RECIENTE (ultimos 35 dias desde la fecha mas
  //    nueva que exista en toda la tabla). Esto oculta automaticamente:
  //    - contratos ya desactivados (sin datos nuevos)
  //    - jugadores que se movieron de contrato (el contrato viejo ya no
  //      tiene actividad reciente, aunque tenga historial antiguo)
  const VENTANA_DIAS_ACTIVO = 35;
  try{
    const data = await fetchAllPaged(
      'usuarios_tiktok',
      'contrato, fecha_periodo, fecha_datos, periodo_archivo',
      q => q.not('contrato', 'is', null)
    );

    const maxPorContrato = {};
    let maxGlobal = '';
    (data||[]).forEach(r => {
      const k = periodoKeyDe(r);
      if(!k || !r.contrato) return;
      if(k > maxGlobal) maxGlobal = k;
      if(!maxPorContrato[r.contrato] || k > maxPorContrato[r.contrato]){
        maxPorContrato[r.contrato] = k;
      }
    });

    const fechaLimite = new Date(maxGlobal);
    fechaLimite.setDate(fechaLimite.getDate() - VENTANA_DIAS_ACTIVO);
    const limiteStr = fechaLimite.toISOString().slice(0,10);
    ESTADO.fechaCorteBajas = limiteStr; // usado tambien para ocultar jugadores de baja

    const activos = Object.keys(maxPorContrato).filter(c => maxPorContrato[c] >= limiteStr);
    ESTADO.contratosTodos = activos.sort();
  }catch(e){
    mostrarErrorGlobal('No pude leer contratos desde usuarios_tiktok: ' + e.message);
    ESTADO.contratosTodos = [];
  }

  // 2) contratos_equivalencias: nombres de columna CONFIRMADOS (index.html linea 320)
  //    nexus_codigo / vertex_codigo -- ya no se adivinan por introspeccion
  try{
    const { data, error } = await sb.from('contratos_equivalencias').select('nexus_codigo,vertex_codigo');
    if(error) throw error;

    (data || []).forEach(row => {
      const a = row.nexus_codigo;
      const b = row.vertex_codigo;
      if(a && b){
        ESTADO.paresSet.add(a); ESTADO.paresSet.add(b);
        ESTADO.equivMap[a] = b;
        ESTADO.equivMap[b] = a;
      }
    });
  }catch(e){
    mostrarErrorGlobal('No pude leer contratos_equivalencias: ' + e.message + ' (las secciones Pares no van a funcionar hasta resolver esto)');
  }
}

function renderSecciones(){
  const tabs = document.getElementById('sectionTabs');
  tabs.innerHTML = `
    <div class="sectionTab ${ESTADO.seccionActiva==='pares'?'active':''}" onclick="cambiarSeccion('pares')">🔗 Pares</div>
    <div class="sectionTab ${ESTADO.seccionActiva==='nexus'?'active':''}" onclick="cambiarSeccion('nexus')">🅰️ Solo Nexus</div>
    <div class="sectionTab ${ESTADO.seccionActiva==='vertex'?'active':''}" onclick="cambiarSeccion('vertex')">🅱️ Solo Vertex</div>
  `;

  const grid = document.getElementById('contractGrid');
  const todos = ESTADO.contratosTodos;
  let lista = [];

  if(ESTADO.seccionActiva === 'pares'){
    const yaMostrados = new Set();
    todos.forEach(c => {
      if(ESTADO.paresSet.has(c) && !yaMostrados.has(c)){
        const pareja = ESTADO.equivMap[c];
        lista.push(c);
        yaMostrados.add(c);
        if(pareja){ yaMostrados.add(pareja); if(todos.includes(pareja)) lista.push(pareja); }
      }
    });
  } else if(ESTADO.seccionActiva === 'nexus'){
    lista = todos.filter(c => !esSerieB(c) && !ESTADO.paresSet.has(c));
  } else {
    lista = todos.filter(c => esSerieB(c) && !ESTADO.paresSet.has(c));
  }

  if(lista.length === 0){
    grid.innerHTML = `<p class="smallNote">Sin contratos en esta sección.</p>`;
    return;
  }

  grid.innerHTML = lista.map(c => `
    <div class="contractCard" onclick="abrirContrato('${c}')">
      <div class="code">${c}</div>
      <div class="name">${esSerieB(c) ? 'Vertex' : 'Nexus'}${ESTADO.equivMap[c] ? ' · pareja: ' + ESTADO.equivMap[c] : ''}</div>
    </div>
  `).join('');
}

function cambiarSeccion(s){
  ESTADO.seccionActiva = s;
  renderSecciones();
}

function volverASecciones(){
  document.getElementById('contractView').classList.add('hidden');
  if(ESTADO.tipo === 'admin'){
    document.getElementById('seccionesWrap').classList.remove('hidden');
  }
}

// ================================================================
// VISTA DE CONTRATO
// ================================================================
async function abrirContrato(codigo){
  ESTADO.contratoAbierto = codigo;
  document.getElementById('seccionesWrap').classList.add('hidden');
  document.getElementById('contractView').classList.remove('hidden');
  document.getElementById('contractTitle').textContent = codigo;
  document.getElementById('btnVolver').style.display = (ESTADO.tipo === 'admin') ? 'inline-block' : 'none';

  // Boton "volver a mi contrato" -- solo aplica a managers viendo un subordinado
  const btnVolverPropio = document.getElementById('btnVolverPropio');
  if(btnVolverPropio){
    btnVolverPropio.style.display = (ESTADO.tipo !== 'admin' && ESTADO.contratoPropio && codigo !== ESTADO.contratoPropio) ? 'inline-block' : 'none';
  }

  // Nombre del contrato: contratos_tokens cubre Nexus Y Vertex (a diferencia
  // de la tabla 'contratos', que parece ser solo Nexus)
  try{
    const { data, error } = await sb
      .from('contratos_tokens')
      .select('nombre_display')
      .eq('contrato', codigo)
      .limit(1);
    if(!error && data && data.length && data[0].nombre_display){
      document.getElementById('contractTitle').textContent = `${codigo} — ${data[0].nombre_display}`;
    }
  }catch(e){ /* silencioso, se queda solo el codigo si falla */ }

  // Subordinados: contratos que le reportan/transfieren a este (jerarquia_contratos)
  // Y TAMBIEN al equivalente Nexus<->Vertex del mismo manager (ej. A002=B003
  // son la misma Hayaris en los dos sistemas -- su equipo incluye ambos lados)
  let equivalenteDe = null;
  try{
    const { data: eq } = await sb
      .from('contratos_equivalencias')
      .select('nexus_codigo,vertex_codigo')
      .or(`nexus_codigo.eq.${codigo},vertex_codigo.eq.${codigo}`)
      .maybeSingle();
    if(eq){
      equivalenteDe = eq.nexus_codigo === codigo ? eq.vertex_codigo : eq.nexus_codigo;
    }
  }catch(e){ /* silencioso */ }

  try{
    const codigosABuscar = equivalenteDe ? [codigo, equivalenteDe] : [codigo];
    const { data: subs, error: errSubs } = await sb
      .from('jerarquia_contratos')
      .select('contrato, notas')
      .in('reporta_a', codigosABuscar);
    ESTADO.subordinadosActuales = (!errSubs && subs) ? subs : [];
    // Agregar el equivalente mismo como tarjeta (mismo manager, otro sistema)
    if(equivalenteDe){
      ESTADO.subordinadosActuales.unshift({ contrato: equivalenteDe, notas: 'Mismo manager — equivalente en el otro sistema' });
    }
  }catch(e){ ESTADO.subordinadosActuales = []; }

  const periodos = await obtenerPeriodosDeContrato(codigo);
  const select = document.getElementById('periodoSelect');

  if(periodos.length === 0){
    select.innerHTML = '<option>Sin periodos</option>';
    document.getElementById('tablaWrap').innerHTML = renderSeccionEquipo() + '<p class="smallNote">Sin datos para este contrato.</p>';
    return;
  }

  select.innerHTML = periodos.map(p =>
    `<option value="${p}">${fmtFecha(p)}${esPeriodoMarcable(p) ? '' : ' (histórico)'}</option>`
  ).join('');

  // default: el más reciente (primero de la lista, ya viene desc)
  select.value = periodos[0];
  await cargarPeriodo(periodos[0]);
}

// Vertex sube varias veces al mes -- nos quedamos solo con el ULTIMO corte
// de cada mes calendario, no con cada subida intermedia
function agruparPorMesUltimoCorte(periodosArray){
  const porMes = {};
  periodosArray.forEach(p => {
    const mesKey = String(p).slice(0, 7); // YYYY-MM
    if(!porMes[mesKey] || p > porMes[mesKey]) porMes[mesKey] = p;
  });
  return Object.values(porMes).sort().reverse();
}

async function obtenerPeriodosDeContrato(codigo){
  try{
    const data = await fetchAllPaged(
      'usuarios_tiktok',
      'fecha_periodo, fecha_datos, periodo_archivo',
      q => q.eq('contrato', codigo)
    );

    const set = new Set();
    (data||[]).forEach(r => {
      const k = periodoKeyDe(r);
      if(k) set.add(k);
    });
    return agruparPorMesUltimoCorte(Array.from(set)); // más reciente primero, 1 por mes
  }catch(e){
    mostrarErrorGlobal('No pude leer periodos de ' + codigo + ': ' + e.message);
    return [];
  }
}

async function cargarPeriodo(periodo){
  ESTADO.periodoActual = periodo;
  const wrap = document.getElementById('tablaWrap');
  wrap.innerHTML = '<p class="loading">Cargando...</p>';

  try{
    // 1) Filas crudas del periodo (dias/horas/diamantes/pagado)
    let { data, error } = await sb
      .from('usuarios_tiktok')
      .select('*')
      .eq('contrato', ESTADO.contratoAbierto)
      .eq('fecha_periodo', periodo);

    if(error) throw error;

    if(!data || data.length === 0){
      const r2 = await sb
        .from('usuarios_tiktok')
        .select('*')
        .eq('contrato', ESTADO.contratoAbierto)
        .eq('fecha_datos', periodo);
      if(r2.error) throw r2.error;
      data = r2.data;
    }

    // 2) Sueldo del CONTRATO (manager) este periodo — resumen_contratos completo
    let resumenContrato = null;
    try{
      const { data: resumen, error: errResumen } = await sb
        .from('resumen_contratos')
        .select('*')
        .eq('contrato', ESTADO.contratoAbierto)
        .eq('periodo', periodo);
      if(!errResumen && resumen && resumen.length){
        resumenContrato = resumen[0];
      }
    }catch(e){ /* silencioso: resumen_contratos puede no existir para B-series */ }

    // 3) Incentivo por jugador:
    //    - B-series (Vertex): ya viene directo en usuarios_tiktok (coins_incentivo/paypal_incentivo)
    //    - A-series (Nexus): se sube a reportes_contratos (confirmado en codigo real
    //      de 12_notas_HIBRIDO_MEVAK.py linea 254), usuarios_tiktok siempre queda en 0 para Nexus
    let incentivoPorUsuario = {};
    if(!esSerieB(ESTADO.contratoAbierto)){
      try{
        const rep = await fetchAllPaged(
          'reportes_contratos', '*',
          q => q.eq('contrato', ESTADO.contratoAbierto).eq('periodo', periodo)
        );
        (rep||[]).forEach(r => { incentivoPorUsuario[r.usuario] = r; });
      }catch(e){ /* silencioso */ }
    }

    // 4) Resolver usuarios en blanco: si 'usuario' viene vacio, buscar el ultimo
    //    nombre conocido de ese id_tiktok en cualquier otro periodo
    const fallbackUsuarios = await resolverUsuariosFaltantes(data || []);

    renderTablaUsuarios(data || [], periodo, resumenContrato, fallbackUsuarios, incentivoPorUsuario);
  }catch(e){
    wrap.innerHTML = `<div class="errBox">⚠️ Error cargando el periodo: ${e.message}</div>`;
  }
}

async function resolverUsuariosFaltantes(rows){
  const faltantes = [...new Set(rows.filter(r => !r.usuario).map(r => r.id_tiktok))];
  if(faltantes.length === 0) return {};

  try{
    const { data, error } = await sb
      .from('usuarios_tiktok')
      .select('id_tiktok, usuario, fecha_periodo, fecha_datos')
      .in('id_tiktok', faltantes)
      .not('usuario', 'is', null);
    if(error) throw error;

    const masReciente = {};
    (data || []).forEach(r => {
      const k = periodoKeyDe(r) || '';
      if(!masReciente[r.id_tiktok] || k > masReciente[r.id_tiktok].k){
        masReciente[r.id_tiktok] = { usuario: r.usuario, k };
      }
    });

    const resultado = {};
    Object.keys(masReciente).forEach(id => { resultado[id] = masReciente[id].usuario; });
    return resultado;
  }catch(e){
    return {};
  }
}

function renderCoinsTexto(row, repRow){
  const fuente = esSerieB(row.contrato) ? row : (repRow || row);
  const coins = Number(fuente.coins_incentivo || 0);
  return coins > 0 ? coins.toLocaleString('es-MX') : '—';
}

function renderPaypalTexto(row, repRow){
  const fuente = esSerieB(row.contrato) ? row : (repRow || row);
  const paypal = Number(fuente.paypal_incentivo || 0);
  return paypal > 0 ? fmtMoney(paypal) : '—';
}

// Replica EXACTA de calcularCumpleReal() en index.html v1.5.8 -- para que el
// panel nunca diga Si/No distinto de lo que el jugador ve en mi-progreso.html.
// B-series: confia en el 'cumple' que sube Vertex (umbral propio por contrato).
// A002/A006/A014: regla fija 7d/15h. Resto de A-series: cumple = tiene incentivo real.
function calcularCumpleReal(row, repRow){
  if(esSerieB(row.contrato)){
    return row.cumple === true || row.cumple === 'true' || row.cumple === 'SI';
  }
  const fuente = repRow || row;
  const tieneRegalo = Number(fuente.paypal_incentivo || 0) > 0 || Number(fuente.coins_incentivo || 0) > 0;
  if(row.contrato === 'A002' || row.contrato === 'A006' || row.contrato === 'A014'){
    return (row.dias || 0) >= 7 && (row.horas || 0) >= 15;
  }
  return tieneRegalo;
}

function renderCumpleTexto(cumpleBool){
  return cumpleBool ? 'Sí' : 'No';
}

// Prefiere el campo 'duracion' ya formateado (ej. "13h 44min 2s") que trae el
// crudo. Si no viene, lo calcula desde horas decimales como respaldo.
function formatDuracionTexto(row){
  if(row.duracion) return row.duracion;
  const horas = Number(row.horas || 0);
  const totalMin = Math.round(horas * 60);
  const d = Math.floor(totalMin / 1440);
  const h = Math.floor((totalMin % 1440) / 60);
  const m = totalMin % 60;
  const partes = [];
  if(d > 0) partes.push(`${d}d`);
  partes.push(`${h}h`);
  partes.push(`${m}m`);
  return partes.join(' ');
}

function renderTablaUsuarios(rows, periodo, resumenContrato, fallbackUsuarios, incentivoPorUsuario){

  if(rows.length === 0){
    wrap.innerHTML = '<p class="smallNote">Sin jugadores en este periodo.</p>';
    return;
  }

  const marcable = esPeriodoMarcable(periodo);
  fallbackUsuarios = fallbackUsuarios || {};
  incentivoPorUsuario = incentivoPorUsuario || {};

  // Orden: mayor dias, luego mayor horas
  const rowsOrdenadas = [...rows].sort((a,b) => {
    const d = (b.dias ?? 0) - (a.dias ?? 0);
    if(d !== 0) return d;
    return (b.horas ?? 0) - (a.horas ?? 0);
  });

  // sueldo_pagado del contrato: tomamos el valor de la primera fila (debe ser
  // igual en todas, ya que es una sola decisión por contrato+periodo)
  const sueldoPagado = !!(rows[0] && rows[0].sueldo_pagado);
  const confirmadoPorSueldo = rows[0] ? rows[0].confirmado_por_sueldo : null;
  const fechaPagoSueldo = rows[0] ? rows[0].fecha_pago_sueldo : null;

  const filas = rowsOrdenadas.map(r => {
    const nombreMostrar = r.usuario || fallbackUsuarios[r.id_tiktok];
    const esFallback = !r.usuario && !!fallbackUsuarios[r.id_tiktok];
    return `
    <tr class="userRow" data-id="${r.id_tiktok}">
      <td onclick="abrirHistorial('${r.id_tiktok}')" style="color:var(--cyan); cursor:pointer; font-weight:bold;">
        ${nombreMostrar || '(sin nombre)'}${esFallback ? ' <span class="smallNote" title="Nombre tomado de otro periodo, este periodo vino en blanco">(hist.)</span>' : ''}
      </td>
      <td>${r.agencia || '—'}</td>
      <td>${r.dias ?? '—'}</td>
      <td>${formatDuracionTexto(r)}</td>
      <td>${(r.diamantes ?? 0).toLocaleString('es-MX')}</td>
      <td>${renderCumpleTexto(calcularCumpleReal(r, incentivoPorUsuario[r.usuario]))}</td>
      <td>${renderCoinsTexto(r, incentivoPorUsuario[r.usuario])}</td>
      <td>${renderPaypalTexto(r, incentivoPorUsuario[r.usuario])}</td>
      <td>${renderToggleRegalo(r, marcable)}</td>

  const sueldoPropio = resumenContrato ? Number(resumenContrato.total_paypal || 0) : null;
  const transferencias = resumenContrato ? Number(resumenContrato.transferencias_recibidas || 0) : null;
  const totalFinal = resumenContrato ? Number(resumenContrato.total_final || 0) : null;
  const totalCoins = resumenContrato ? Number(resumenContrato.total_coins || 0) : null;
  const usuariosValidos = resumenContrato ? resumenContrato.usuarios_validos : null;
  // Columna numerica de regalo pagado por manager (aun no existe en Vertex,
  // se detecta sola si algun dia aparece -- no se inventa nombre fijo)
  const candidatosRegaloManager = ['regalo_pagado_manager', 'regalo_manager', 'monto_regalo_manager'];
  let regaloManager = null;
  if(resumenContrato){
    for(const c of candidatosRegaloManager){
      if(resumenContrato[c] !== undefined && resumenContrato[c] !== null){
        regaloManager = Number(resumenContrato[c]);
        break;
      }
    }
  }

  wrap.innerHTML = `
    ${marcable ? '' : '<div class="histBadge" style="margin-bottom:8px;">📜 Periodo histórico — solo lectura, no se puede marcar (regla: pagos válidos desde 2026)</div>'}

    <div style="background:var(--panel); border:2px solid var(--border); border-radius:10px; padding:14px 18px; margin-bottom:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;">
        <div>
          <div class="smallNote">💰 SUELDO DEL CONTRATO (manager) — este periodo</div>
          <div style="font-size:22px; font-weight:bold; color:var(--cyan);">
            ${totalFinal !== null ? fmtMoney(totalFinal) : 'Sin dato'}
          </div>
          ${(!resumenContrato) ? '<div class="smallNote" style="color:var(--pink);">⚠️ Vertex no sube el sueldo del manager a Supabase todavía (confirmado con ellos) — no hay número confiable que mostrar aquí para este contrato</div>' : ''}
        </div>
        <div>${renderToggleSueldoContrato(sueldoPagado, confirmadoPorSueldo, fechaPagoSueldo, marcable)}</div>
      </div>
      ${resumenContrato ? `
        <div style="margin-top:14px; padding-top:12px; border-top:1px solid var(--border); font-size:14px;">
          <div style="display:flex; justify-content:space-between; max-width:420px; padding:3px 0;">
            <span class="smallNote">Sueldo propio (%)</span><span>${fmtMoney(sueldoPropio)}</span>
          </div>
          <div style="display:flex; justify-content:space-between; max-width:420px; padding:3px 0;">
            <span class="smallNote">+ Transferencias recibidas</span><span>${fmtMoney(transferencias)}</span>
          </div>
          ${regaloManager !== null ? `
          <div style="display:flex; justify-content:space-between; max-width:420px; padding:3px 0;">
            <span class="smallNote">− Regalo pagado por el manager</span><span style="color:var(--pink);">−${fmtMoney(Math.abs(regaloManager))}</span>
          </div>` : (resumenContrato.observaciones && /regalo/i.test(resumenContrato.observaciones) ? `
          <div class="smallNote" style="margin-top:4px; font-style:italic;">📝 ${resumenContrato.observaciones}</div>
          ` : '')}
          <div style="display:flex; justify-content:space-between; max-width:420px; padding:3px 0; border-top:1px solid var(--border); margin-top:4px; font-weight:bold;">

        </div>

          <div>🎁 Total Coins: <b style="color:var(--white);">${totalCoins.toLocaleString('es-MX')}</b></div>
          <div>👥 Usuarios que cumplen: <b style="color:var(--white);">${usuariosValidos ?? '—'}</b></div>

          <th>Usuario</th><th>Agencia</th><th>Días</th><th>Horas</th><th>Diamantes</th>

        </tr>
      </thead>

    </table>

    <div style="margin-top:18px;">
      <button class="btn btn-secondary" onclick="toggleMatrizMultiMes('${ESTADO.contratoAbierto}')" id="btnMatriz">
        📊 Ver histórico multi-mes de este contrato

      <div id="matrizMultiMesWrap" class="hidden" style="margin-top:14px;"></div>
    </div>

    ${renderSeccionEquipo()}

// Tarjetas de contratos subordinados (jerarquia_contratos.reporta_a = este contrato)
// -- permite a un manager ver tambien los contratos/jugadores de su equipo
function renderSeccionEquipo(){
  const subs = ESTADO.subordinadosActuales || [];
  if(subs.length === 0) return '';

  const tarjetas = subs.map(s => `
    <div class="contractCard" onclick="abrirContrato('${s.contrato}')">
      <div class="code">${s.contrato}</div>

  `).join('');

  return `
    <div style="margin-top:24px; border-top:1px solid var(--border); padding-top:18px;">
      <div style="font-size:16px; font-weight:bold; color:var(--cyan); margin-bottom:10px;">
        👥 Tu equipo — contratos que te reportan
      </div>
      <div class="contractGrid">${tarjetas}</div>
      <div id="resumenEquipoWrap"></div>
    </div>
  `;
}

// Suma total del equipo: sueldo del manager actual + de cada subordinado,
// desglosado uno por uno y con el total abajo -- para que Hayaris (o quien
// sea) no tenga que sumar a mano lo que recibe de todo su equipo.
async function cargarResumenEquipo(){
  const wrap = document.getElementById('resumenEquipoWrap');
  if(!wrap) return;

  const equipo = ESTADO.subordinadosActuales || [];
  if(equipo.length === 0){ wrap.innerHTML = ''; return; }

  wrap.innerHTML = '<p class="loading" style="margin-top:10px;">Calculando total del equipo...</p>';

  const codigoBase = ESTADO.contratoAbierto;
  const todos = [codigoBase, ...equipo.map(s => s.contrato)];

  const filas = [];
  let totalGeneral = 0;
  let faltanDatos = false;

  for(const c of todos){
    let monto = null;
    try{
      const periodos = await obtenerPeriodosDeContrato(c);
      if(periodos.length){
        const { data } = await sb
          .from('resumen_contratos')
          .select('total_final')
          .eq('contrato', c)
          .eq('periodo', periodos[0])
          .maybeSingle();
        if(data && data.total_final !== null && data.total_final !== undefined){
          monto = Number(data.total_final);
        }
      }
    }catch(e){ /* silencioso */ }

    if(monto !== null){
      totalGeneral += monto;
    } else {
      faltanDatos = true;
    }
    filas.push({ contrato:c, monto });
  }

  const filasHtml = filas.map(f => `
    <div style="display:flex; justify-content:space-between; max-width:420px; padding:4px 0;">
      <span>${f.contrato}${f.contrato === codigoBase ? ' (tú)' : ''}</span>
      <span>${f.monto !== null ? fmtMoney(f.monto) : 'Sin dato'}</span>
    </div>
  `).join('');

  wrap.innerHTML = `
    <div style="background:var(--panel); border:2px solid var(--cyan); border-radius:10px; padding:14px 18px; margin-top:14px;">
      <div class="smallNote">💰 SUMA TOTAL DEL EQUIPO — este periodo (tú + todos los que te reportan)</div>
      <div style="margin-top:8px;">${filasHtml}</div>
      <div style="display:flex; justify-content:space-between; max-width:420px; padding:6px 0; border-top:1px solid var(--border); margin-top:6px; font-weight:bold; font-size:18px;">
        <span>TOTAL</span><span style="color:var(--cyan);">${fmtMoney(totalGeneral)}</span>
      </div>
      ${faltanDatos ? '<div class="smallNote" style="color:var(--pink); margin-top:6px;">⚠️ Algún(os) contrato(s) no tienen dato confirmado en resumen_contratos — no se sumaron, el total puede estar incompleto.</div>' : ''}
    </div>
  `;
}

let matrizCache = {}; // contrato -> html ya armado, para no recalcular al toggle

async function toggleMatrizMultiMes(contrato){
  const wrap = document.getElementById('matrizMultiMesWrap');
  const abierta = !wrap.classList.contains('hidden');

  if(abierta){
    wrap.classList.add('hidden');
    return;
  }

  wrap.classList.remove('hidden');

  if(matrizCache[contrato]){
    wrap.innerHTML = matrizCache[contrato];
    return;
  }

  wrap.innerHTML = '<p class="loading">Cargando historial completo del contrato...</p>';

  try{
    const rows = await fetchAllPaged('usuarios_tiktok', '*', q => q.eq('contrato', contrato));

    if(!rows || rows.length === 0){
      wrap.innerHTML = '<p class="smallNote">Sin historial.</p>';
      return;
    }

    // resolver usuarios en blanco tambien aqui
    const fallback = await resolverUsuariosFaltantes(rows);

    // periodos distintos, agrupados por mes (1 corte final por mes), tope 6 meses
    const periodosSetRaw = new Set(rows.map(r => periodoKeyDe(r)).filter(Boolean));
    const periodos = agruparPorMesUltimoCorte(Array.from(periodosSetRaw)).slice(0, 6);
    // Orden de columnas tipo Excel original: mes actual primero, luego los
    // anteriores en orden ascendente (no todo cronologico de corrido)
    const periodosAsc = periodos.length ? [periodos[0], ...periodos.slice(1).reverse()] : [];

    // Incentivo real (A-series) para poder calcular Cumple igual que index.html --
    // cruce por periodo+usuario, mismo criterio que el resto del panel
    const incentivoPorPeriodoUsuario = {};
    if(!esSerieB(contrato)){
      try{
        const rep = await fetchAllPaged(
          'reportes_contratos', 'periodo,usuario,paypal_incentivo,coins_incentivo',
          q => q.eq('contrato', contrato).in('periodo', periodos)
        );
        (rep||[]).forEach(r => { incentivoPorPeriodoUsuario[`${r.periodo}|${r.usuario}`] = r; });
      }catch(e){ /* silencioso */ }
    }

    // pivot: id_tiktok -> { usuario, agencia, [periodo]: {dias,horas,duracion,cumpleReal} }
    const pivot = {};
    rows.forEach(r => {
      const k = periodoKeyDe(r);
      if(!periodos.includes(k)) return;
      const id = r.id_tiktok;
      const repRow = incentivoPorPeriodoUsuario[`${k}|${r.usuario}`];
      if(!pivot[id]) pivot[id] = { usuario: r.usuario || fallback[id] || '(sin nombre)', agencia: r.agencia || '—', datos:{} };
      pivot[id].datos[k] = { dias:r.dias, horas:r.horas, duracion:r.duracion, cumpleReal: calcularCumpleReal(r, repRow) };
      if(r.usuario) pivot[id].usuario = r.usuario; // preferir nombre real si aparece en cualquier mes
      if(r.agencia) pivot[id].agencia = r.agencia;
    });

    // ordenar por dias/horas del periodo mas reciente, Y excluir jugadores
    // dados de baja (sin fila en el periodo mas reciente de este contrato)
    const idsOrdenados = Object.keys(pivot)
      .filter(id => pivot[id].datos[periodos[0]] !== undefined)
      .sort((a,b) => {
        const da = pivot[a].datos[periodos[0]]?.dias ?? -1;
        const db = pivot[b].datos[periodos[0]]?.dias ?? -1;
        if(db !== da) return db - da;
        const ha = pivot[a].datos[periodos[0]]?.horas ?? -1;
        const hb = pivot[b].datos[periodos[0]]?.horas ?? -1;
        return hb - ha;
      });

    const headerCols = periodosAsc.map(p => `<th>${fmtFecha(p)}</th>`).join('');

    const filas = idsOrdenados.map(id => {
      const nombre = pivot[id].usuario;
      const celdas = periodosAsc.map(p => {
        const d = pivot[id].datos[p];
        if(!d) return `<td class="smallNote">—</td>`;
        const color = d.cumpleReal ? 'var(--green)' : 'var(--red)';
        return `<td style="color:${color}; font-weight:bold;">${d.dias ?? 0}d / ${formatDuracionTexto(d)}</td>`;
      }).join('');
      return `<tr><td style="color:var(--cyan); font-weight:bold;">${nombre}</td><td class="smallNote">${pivot[id].agencia}</td>${celdas}</tr>`;
    }).join('');

    const html = `
      <p class="smallNote">Últimos ${periodos.length} periodos disponibles — primera columna es el mes en curso, el resto en orden cronológico ascendente (igual que el Excel).</p>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>Usuario</th><th>Agencia</th>${headerCols}</tr></thead>
          <tbody>${filas}</tbody>
        </table>
      </div>
    `;

    matrizCache[contrato] = html;
    wrap.innerHTML = html;

  }catch(e){
    wrap.innerHTML = `<div class="errBox">⚠️ Error armando la matriz: ${e.message}</div>`;
  }
}

function abrirConfirmacion(payload){
  const nuevoValor = !payload.valorActual;
  const hoy = new Date().toISOString().slice(0,10);

  const esContrato = payload.scope === 'contrato';
  const tituloContexto = esContrato
    ? `Todo el contrato <b>${payload.contrato}</b> (TODOS los jugadores de este periodo)`
    : `Solo <b>${payload.usuario || payload.id_tiktok}</b>`;
  const campoLabel = payload.campo === 'sueldo' ? 'SUELDO (del manager)' : 'REGALO (de este jugador)';

  const overlay = document.getElementById('modalOverlay');
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <div class="modal">
      <span class="closeX" onclick="cerrarModal()">✕</span>
      <h3>${nuevoValor ? '✅ Marcar como PAGADO' : '⬜ Marcar como NO pagado'}</h3>
      <p>Afecta a: ${tituloContexto}</p>
      <p>Campo: <b>${campoLabel}</b></p>
      ${esContrato ? '<p class="smallNote">⚠️ Esto marca el sueldo del CONTRATO completo, no de un jugador en particular.</p>' : ''}
      <p>Vas a marcar esto como <b>${nuevoValor ? 'PAGADO' : 'NO PAGADO'}</b>.</p>
      ${nuevoValor ? `
        <label class="smallNote">Fecha de pago:</label><br>
        <input type="date" id="fechaPagoInput" value="${hoy}"
          style="padding:8px; border-radius:6px; border:2px solid var(--border); background:#0a0a0a; color:#fff;">
      ` : ''}
      <div id="modalMsg"></div>
      <div class="modalActions">
        <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
        <button class="btn" onclick="confirmarPago(${JSON.stringify(payload).replace(/"/g,'&quot;')}, ${nuevoValor})">Confirmar</button>
      </div>
    </div>
  `;
}

function cerrarModal(){
  document.getElementById('modalOverlay').classList.add('hidden');
  document.getElementById('modalOverlay').innerHTML = '';
}

async function confirmarPago(payload, nuevoValor){
  const msgBox = document.getElementById('modalMsg');
  msgBox.innerHTML = '<p class="loading">Guardando...</p>';

  const confirmadoPor = ESTADO.tipo === 'admin' ? 'admin' : ESTADO.contrato;
  const fechaInput = document.getElementById('fechaPagoInput');
  const fechaPago = nuevoValor ? (fechaInput ? fechaInput.value : new Date().toISOString().slice(0,10)) : null;

  const campoPagado = payload.campo === 'sueldo' ? 'sueldo_pagado' : 'regalo_pagado';
  const campoFecha  = payload.campo === 'sueldo' ? 'fecha_pago_sueldo' : 'fecha_pago_regalo';
  const campoQuien  = payload.campo === 'sueldo' ? 'confirmado_por_sueldo' : 'confirmado_por_regalo';

  const updateObj = {
    [campoPagado]: nuevoValor,
    [campoFecha]: fechaPago,
    [campoQuien]: nuevoValor ? confirmadoPor : null
  };

  try{
    let data, error;

    if(payload.scope === 'contrato'){
      // BULK: aplica a TODAS las filas de ese contrato+periodo (sueldo es uno solo por manager)
      let r = await sb
        .from('usuarios_tiktok')
        .update(updateObj)
        .eq('contrato', payload.contrato)
        .eq('fecha_periodo', payload.periodo)
        .select();

      if((!r.data || r.data.length === 0) && !r.error){
        r = await sb
          .from('usuarios_tiktok')
          .update(updateObj)
          .eq('contrato', payload.contrato)
          .eq('fecha_datos', payload.periodo)
          .select();
      }
      data = r.data; error = r.error;

    } else {
      // INDIVIDUAL: solo esa fila (id_tiktok + periodo)
      let r = await sb
        .from('usuarios_tiktok')
        .update(updateObj)
        .eq('id_tiktok', payload.id_tiktok)
        .eq('fecha_periodo', payload.periodo)
        .select();

      if((!r.data || r.data.length === 0) && !r.error){
        r = await sb
          .from('usuarios_tiktok')
          .update(updateObj)
          .eq('id_tiktok', payload.id_tiktok)
          .eq('fecha_datos', payload.periodo)
          .select();
      }
      data = r.data; error = r.error;
    }

    if(error) throw error;
    if(!data || data.length === 0){
      msgBox.innerHTML = '<div class="errBox">⚠️ No se encontró ninguna fila que actualizar (revisa periodo/contrato/id_tiktok).</div>';
      return;
    }

    msgBox.innerHTML = `<div class="okBox">✅ Guardado (${data.length} fila${data.length>1?'s':''}).</div>`;
    setTimeout(async () => {
      cerrarModal();
      await cargarPeriodo(ESTADO.periodoActual);
    }, 600);

  }catch(e){
    msgBox.innerHTML = `<div class="errBox">⚠️ Error al guardar: ${e.message}</div>`;
  }
}

// ================================================================
// HISTORIAL POR USUARIO (todas las filas de usuarios_tiktok para ese ID)
// ================================================================
async function abrirHistorial(idTiktok){
  const overlay = document.getElementById('modalOverlay');
  overlay.classList.remove('hidden');
  overlay.innerHTML = `<div class="modal"><span class="closeX" onclick="cerrarModal()">✕</span>
    <h3>📜 Historial — ${idTiktok}</h3><p class="loading">Cargando...</p></div>`;

  try{
    const { data, error } = await sb
      .from('usuarios_tiktok')
      .select('*')
      .eq('id_tiktok', idTiktok);
    if(error) throw error;

    // Incentivo real de A-series vive en reportes_contratos. Cruce por
    // periodo+usuario, IGUAL que mi-progreso.html (no por usuario_id) --
    // el nombre puede variar por periodo, por eso la llave compuesta.
    const contratosA = [...new Set((data||[]).map(r => r.contrato).filter(c => c && !esSerieB(c)))];
    const periodosPresentes = (data||[]).map(r => periodoKeyDe(r)).filter(Boolean);
    const incentivoPorPeriodo = {}; // clave: `${periodo}|${usuario}`
    for(const c of contratosA){
      try{
        const rep = await fetchAllPaged(
          'reportes_contratos', 'periodo,usuario,paypal_incentivo,coins_incentivo',
          q => q.eq('contrato', c).in('periodo', periodosPresentes)
        );
        (rep||[]).forEach(r => { incentivoPorPeriodo[`${r.periodo}|${r.usuario}`] = r; });
      }catch(e){ /* silencioso */ }
    }

    // Agrupar por mes -- nos quedamos con el ULTIMO corte de cada mes calendario
    // (para el mes en curso, ese "ultimo corte" es simplemente la subida mas
    // reciente disponible, ya que el mes no ha cerrado)
    const porMes = {};
    (data||[]).forEach(r => {
      const k = periodoKeyDe(r);
      if(!k) return;
      const mesKey = k.slice(0, 7);
      if(!porMes[mesKey] || k > periodoKeyDe(porMes[mesKey])){
        porMes[mesKey] = r;
      }
    });
    const filasOrdenadas = Object.values(porMes)
      .sort((a,b) => (periodoKeyDe(b)||'').localeCompare(periodoKeyDe(a)||''));

    // Seguro extra: si el ID no tiene ninguna actividad reciente, tratarlo
    // como dado de baja y no mostrar nada (aunque esta funcion se abra desde
    // algun lugar que no haya pasado ya por el filtro de busqueda/matriz)
    const masRecienteGlobal = filasOrdenadas[0] ? periodoKeyDe(filasOrdenadas[0]) : null;
    if(ESTADO.fechaCorteBajas && masRecienteGlobal && masRecienteGlobal < ESTADO.fechaCorteBajas){
      document.getElementById('modalOverlay').innerHTML = `
        <div class="modal">
          <span class="closeX" onclick="cerrarModal()">✕</span>
          <p class="smallNote">Este ID no tiene actividad reciente (posible baja formal) — no se muestra historial.</p>
        </div>
      `;
      return;
    }

    const filas = filasOrdenadas
      // sin tope -- se muestra TODO el historial mensual disponible de este usuario
      .map((r, i) => {
        // filasOrdenadas viene mas reciente primero -- el "mes anterior" cronologico
        // de la fila i es la fila i+1 (mas vieja)
        const anterior = filasOrdenadas[i + 1];
        const huboCambio = anterior && anterior.usuario && r.usuario && anterior.usuario !== r.usuario;
        return `
        <tr>
          <td>${fmtFecha(periodoKeyDe(r))}</td>
          <td>${r.contrato || '—'}</td>
          <td>${r.agencia || '—'}</td>
          <td>
            ${r.usuario || '—'}
            ${huboCambio ? `<div class="smallNote" style="color:var(--pink);">🔄 antes: ${anterior.usuario}</div>` : ''}
          </td>
          <td>${r.dias ?? '—'}</td>
          <td>${formatDuracionTexto(r)}</td>
          <td>${(r.diamantes ?? 0).toLocaleString('es-MX')}</td>
          <td>${renderCoinsTexto(r, incentivoPorPeriodo[`${periodoKeyDe(r)}|${r.usuario}`])}</td>
          <td>${renderPaypalTexto(r, incentivoPorPeriodo[`${periodoKeyDe(r)}|${r.usuario}`])}</td>
          <td>${r.regalo_pagado ? '✅ '+(r.confirmado_por_regalo||'') : (esPeriodoMarcable(periodoKeyDe(r)) ? '⬜' : '🔒')}</td>
        </tr>
      `;}).join('');

    document.getElementById('modalOverlay').innerHTML = `
      <div class="modal">
        <span class="closeX" onclick="cerrarModal()">✕</span>
        <h3>📜 Últimos cierres de mes — ${idTiktok}</h3>
        ${filas ? `
          <table>
            <thead><tr>
              <th>Periodo</th><th>Contrato</th><th>Agencia</th><th>Usuario</th><th>Días</th><th>Horas</th>
              <th>Diamantes</th><th>Coins</th><th>Paypal</th><th>Regalo pag.</th>
            </tr></thead>
            <tbody>${filas}</tbody>
          </table>
        ` : '<p class="smallNote">Sin historial.</p>'}
      </div>
    `;
  }catch(e){
    document.getElementById('modalOverlay').innerHTML =
      `<div class="modal"><span class="closeX" onclick="cerrarModal()">✕</span>
       <div class="errBox">⚠️ Error cargando historial: ${e.message}</div></div>`;
  }
}

// ================================================================
// BÚSQUEDA UNIVERSAL (ID o usuario, cualquier serie, cualquier periodo)
// ================================================================
let searchTimeout = null;
document.addEventListener('input', (e) => {
  if(e.target.id === 'searchInput'){
    clearTimeout(searchTimeout);
    const q = e.target.value.trim();
    if(q.length < 2){
      document.getElementById('searchResults').classList.add('hidden');
      return;
    }
    searchTimeout = setTimeout(() => buscarUsuario(q), 350);
  }
});

document.addEventListener('click', (e) => {
  if(!document.getElementById('searchBox').contains(e.target)){
    document.getElementById('searchResults').classList.add('hidden');
  }
});

async function buscarUsuario(q){
  const resultsBox = document.getElementById('searchResults');
  resultsBox.classList.remove('hidden');
  resultsBox.innerHTML = '<div class="searchItem loading">Buscando...</div>';

  try{
    let query = sb.from('usuarios_tiktok').select('*');

    // Si parece ID numérico largo, busca exacto; si no, busca por usuario (ilike)
    if(/^\d{6,}$/.test(q)){
      query = query.eq('id_tiktok', q);
    } else {
      query = query.ilike('usuario', `%${q}%`);
    }

    // Si es manager, restringir a su propio contrato
    if(ESTADO.tipo !== 'admin' && ESTADO.contrato){
      query = query.eq('contrato', ESTADO.contrato);
    }

    const { data, error } = await query.range(0, 999);
    if(error) throw error;

    if(!data || data.length === 0){
      resultsBox.innerHTML = '<div class="searchItem">Sin resultados.</div>';
      return;
    }

    // Agrupar por id_tiktok, quedarnos con la fila más reciente de cada uno
    const porId = {};
    data.forEach(r => {
      const k = r.id_tiktok;
      const pk = periodoKeyDe(r) || '';
      if(!porId[k] || pk > (periodoKeyDe(porId[k]) || '')){
        porId[k] = r;
      }
    });

    // ¿Aparece en el periodo más reciente de SU contrato? (para avisar "no aparece en mes actual")
    const items = (await Promise.all(Object.values(porId).map(async (r) => {
      const periodosContrato = await obtenerPeriodosDeContrato(r.contrato);
      const masReciente = periodosContrato[0];
      const apareceEnActual = masReciente && (periodoKeyDe(r) === masReciente);
      return { row:r, apareceEnActual, masReciente };
    })))
    // Ocultar jugadores dados de baja: sin ninguna fila dentro de la ventana de actividad reciente
    .filter(it => !ESTADO.fechaCorteBajas || periodoKeyDe(it.row) >= ESTADO.fechaCorteBajas);

    if(items.length === 0){
      resultsBox.innerHTML = '<div class="searchItem">Sin resultados activos (puede que el ID/usuario ya esté dado de baja).</div>';
      return;
    }

    resultsBox.innerHTML = items.map(it => `
      <div class="searchItem" onclick='seleccionarDeBusqueda(${JSON.stringify({contrato:it.row.contrato, periodo:periodoKeyDe(it.row), id_tiktok:it.row.id_tiktok}).replace(/"/g,'&quot;')})'>
        <b>${it.row.usuario || '(sin nombre)'}</b> — ${it.row.contrato} — ${it.row.id_tiktok}
        <div class="meta">
          Último periodo visto: ${fmtFecha(periodoKeyDe(it.row))}
          ${it.apareceEnActual ? '' : `<span class="badge-noshow">· No aparece en el mes actual de su contrato (${fmtFecha(it.masReciente)})</span>`}
        </div>
      </div>
    `).join('');

  }catch(e){
    resultsBox.innerHTML = `<div class="searchItem">⚠️ Error buscando: ${e.message}</div>`;
  }
}

async function seleccionarDeBusqueda(sel){
  document.getElementById('searchResults').classList.add('hidden');
  document.getElementById('searchInput').value = '';

  if(ESTADO.tipo === 'admin'){
    await abrirContrato(sel.contrato);
    // seleccionar el periodo donde efectivamente se encontró (puede no ser el más reciente)
    const select = document.getElementById('periodoSelect');
    if([...select.options].some(o => o.value === sel.periodo)){
      select.value = sel.periodo;
      await cargarPeriodo(sel.periodo);
    }
  } else {
    await cargarPeriodo(sel.periodo);
  }

  // abrir directo el historial de ese usuario para contexto inmediato
  setTimeout(() => abrirHistorial(sel.id_tiktok), 300);
}
