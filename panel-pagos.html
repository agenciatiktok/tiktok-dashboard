<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Pagos — Nexus/Vertex</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#000000;
    --panel:#141414;
    --panel-2:#1d1d1d;
    --cyan:#00f2ea;
    --pink:#fe2c55;
    --white:#ffffff;
    --gray:#9a9a9a;
    --green:#28d17c;
    --red:#ff4d4d;
    --border:#2a2a2a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--white);
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    font-size:17px; line-height:1.4;
  }
  a{color:var(--cyan);}
  .hidden{display:none !important;}

  /* ---------- Layout ---------- */
  header{
    display:flex; align-items:center; gap:16px;
    padding:14px 20px; border-bottom:3px solid;
    border-image:linear-gradient(90deg,var(--cyan),var(--pink)) 1;
    position:sticky; top:0; background:var(--bg); z-index:50;
    flex-wrap:wrap;
  }
  header h1{font-size:20px; margin:0; color:var(--cyan); white-space:nowrap;}
  header .who{font-size:13px; color:var(--gray);}
  #searchBox{flex:1; min-width:220px; position:relative;}
  #searchInput{
    width:100%; padding:12px 14px; font-size:17px;
    background:var(--panel); border:2px solid var(--border); border-radius:10px;
    color:var(--white);
  }
  #searchInput:focus{border-color:var(--cyan); outline:none;}
  #searchResults{
    position:absolute; top:110%; left:0; right:0;
    background:var(--panel-2); border:2px solid var(--cyan); border-radius:10px;
    max-height:340px; overflow-y:auto; z-index:100;
  }
  .searchItem{padding:10px 14px; border-bottom:1px solid var(--border); cursor:pointer;}
  .searchItem:hover{background:#242424;}
  .searchItem b{color:var(--cyan);}
  .searchItem .meta{font-size:13px; color:var(--gray);}
  .badge-noshow{color:var(--pink); font-weight:bold;}

  main{padding:20px; max-width:1200px; margin:0 auto;}

  /* ---------- Login gate ---------- */
  #gate{
    max-width:420px; margin:80px auto; padding:28px;
    background:var(--panel); border-radius:14px; border:2px solid var(--border);
  }
  #gate h2{color:var(--cyan); margin-top:0;}
  #gate input{
    width:100%; padding:12px; font-size:17px; margin:10px 0;
    background:#0a0a0a; border:2px solid var(--border); border-radius:8px; color:var(--white);
  }
  .btn{
    background:linear-gradient(135deg,var(--cyan),var(--pink));
    color:#000; border:none; padding:12px 20px; border-radius:8px;
    font-weight:bold; font-size:16px; cursor:pointer;
  }
  .btn:hover{filter:brightness(1.1);}
  .btn-secondary{background:var(--panel-2); color:var(--white); border:2px solid var(--border);}
  .btn-danger{background:var(--red); color:#fff;}
  #gateError{color:var(--pink); font-weight:bold; margin-top:8px;}

  /* ---------- Sections nav (admin) ---------- */
  .sections{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap;}
  .sectionTab{
    padding:10px 18px; border-radius:8px; border:2px solid var(--border);
    background:var(--panel); cursor:pointer; font-weight:bold;
  }
  .sectionTab.active{border-color:var(--cyan); color:var(--cyan);}
  .contractGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px;}
  .contractCard{
    background:var(--panel); border:2px solid var(--border); border-radius:10px;
    padding:14px; cursor:pointer;
  }
  .contractCard:hover{border-color:var(--pink);}
  .contractCard .code{font-size:20px; font-weight:bold; color:var(--cyan);}
  .contractCard .name{font-size:14px; color:var(--gray);}
  .pairDivider{
    grid-column:1/-1; text-align:center; color:var(--gray); font-size:13px;
    border-top:1px dashed var(--border); margin:4px 0; padding-top:6px;
  }

  /* ---------- Contract / table view ---------- */
  .topBar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  select{
    background:var(--panel); color:var(--white); border:2px solid var(--border);
    border-radius:8px; padding:8px 12px; font-size:15px;
  }
  table{width:100%; border-collapse:collapse; background:var(--panel); border-radius:10px; overflow:hidden;}
  th,td{padding:10px; border-bottom:1px solid var(--border); text-align:center; font-size:15px;}
  th{background:var(--panel-2); color:var(--cyan); text-transform:uppercase; font-size:12px; letter-spacing:.5px;}
  tr.userRow:hover{background:#1a1a1a; cursor:pointer;}
  .payToggle{
    display:inline-flex; align-items:center; gap:6px; padding:6px 10px;
    border-radius:20px; border:2px solid var(--border); cursor:pointer; font-weight:bold; font-size:13px;
  }
  .pay-yes{border-color:var(--green); color:var(--green);}
  .pay-no{border-color:var(--gray); color:var(--gray);}
  .pay-locked{border-color:var(--border); color:#555; cursor:not-allowed;}
  .histBadge{font-size:11px; color:var(--gray); text-transform:uppercase;}

  /* ---------- Drilldown modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.75); display:flex;
    align-items:center; justify-content:center; z-index:200; padding:16px;
  }
  .modal{
    background:var(--panel); border:2px solid var(--cyan); border-radius:14px;
    max-width:800px; width:100%; max-height:85vh; overflow-y:auto; padding:22px;
  }
  .modal h3{color:var(--cyan); margin-top:0;}
  .modalActions{display:flex; gap:10px; justify-content:flex-end; margin-top:18px;}
  .closeX{float:right; cursor:pointer; font-size:22px; color:var(--gray);}
  .errBox{background:#3a1414; border:2px solid var(--red); color:#ffb3b3; padding:12px; border-radius:8px; margin:10px 0;}
  .okBox{background:#12331f; border:2px solid var(--green); color:#a3f2c4; padding:12px; border-radius:8px; margin:10px 0;}
  .loading{color:var(--gray); font-style:italic;}
  .smallNote{font-size:13px; color:var(--gray);}
</style>
</head>
<body>

<!-- ============ LOGIN GATE ============ -->
<div id="gate">
  <h2>🔐 Panel de Pagos</h2>
  <p class="smallNote">Entra con tu token (admin o de contrato). Si tienes el link con <code>?token=</code> ya te lo llena solo.</p>
  <input id="tokenInput" placeholder="Pega tu token aquí" autocomplete="off">
  <button class="btn" onclick="intentarLogin()">Entrar</button>
  <div id="gateError"></div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header>
    <h1>📊 Panel de Pagos</h1>
    <span class="who" id="whoAmI"></span>
    <div id="searchBox">
      <input id="searchInput" placeholder="Buscar por ID o @usuario (A o B, cualquier periodo)...">
      <div id="searchResults" class="hidden"></div>
    </div>
    <button class="btn btn-secondary" onclick="cerrarSesion()">Salir</button>
  </header>

  <main>
    <div id="errGlobal"></div>

    <!-- Secciones (solo admin) -->
    <div id="seccionesWrap" class="hidden">
      <div class="sections" id="sectionTabs"></div>
      <div class="contractGrid" id="contractGrid"></div>
    </div>

    <!-- Vista de contrato -->
    <div id="contractView" class="hidden">
      <div class="topBar">
        <div>
          <button class="btn btn-secondary" onclick="volverASecciones()" id="btnVolver">← Volver</button>
          <b id="contractTitle" style="font-size:20px; color:var(--cyan); margin-left:10px;"></b>
        </div>
        <div>
          <label class="smallNote">Periodo:</label>
          <select id="periodoSelect" onchange="cargarPeriodo(this.value)"></select>
        </div>
      </div>
      <div id="tablaWrap" class="loading">Cargando...</div>
    </div>
  </main>
</div>

<!-- ============ MODALS ============ -->
<div id="modalOverlay" class="overlay hidden"></div>

<script>
// ================================================================
// CONFIG — ajusta aquí si algo no cuadra con el schema real
// ================================================================
const SUPABASE_URL = "https://lequmcmudzzilxlessoz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxlcXVtY211ZHp6aWx4bGVzc296Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkxMjkxMzIsImV4cCI6MjA3NDcwNTEzMn0.iTWmbHgkmWLGGUhT0pdN_FtaE0S4J9ZWXKyRD3m8FFM";
const AÑO_MINIMO_PAGOS = 2026; // <- regla: solo 2026 en adelante se puede marcar

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ================================================================
// ESTADO GLOBAL
// ================================================================
let ESTADO = {
  token: null,
  tipo: null,        // 'admin' | 'contrato'
  contrato: null,    // código si es manager
  nombreDisplay: null,
  contratosTodos: [],       // filas crudas de usuarios_tiktok distinct contrato
  paresSet: new Set(),      // códigos que están en contratos_equivalencias
  equivMap: {},             // código -> código pareja
  seccionActiva: 'pares',
  contratoAbierto: null,
  periodoActual: null
};

// ================================================================
// UTILIDADES
// ================================================================
function periodoKeyDe(row){
  return row.fecha_periodo || row.fecha_datos || row.periodo_archivo || null;
}
function esPeriodoMarcable(periodoStr){
  if(!periodoStr) return false;
  const year = parseInt(String(periodoStr).slice(0,4), 10);
  return year >= AÑO_MINIMO_PAGOS;
}
function fmtFecha(f){
  if(!f) return '—';
  try{
    const d = new Date(f);
    return d.toLocaleDateString('es-MX', {year:'numeric', month:'short', day:'numeric'});
  }catch(e){ return f; }
}
function fmtMoney(v){
  if(v===null||v===undefined) return '$0.00';
  return '$' + Number(v).toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function esSerieB(codigo){
  return /^B/i.test(String(codigo||''));
}
function mostrarErrorGlobal(msg){
  document.getElementById('errGlobal').innerHTML =
    `<div class="errBox">⚠️ ${msg}</div>`;
}
function limpiarErrorGlobal(){
  document.getElementById('errGlobal').innerHTML = '';
}

// ================================================================
// LOGIN
// ================================================================
window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const tokenURL = params.get('token');
  if(tokenURL){
    document.getElementById('tokenInput').value = tokenURL;
    intentarLogin();
  }
});

async function intentarLogin(){
  const token = document.getElementById('tokenInput').value.trim();
  const errBox = document.getElementById('gateError');
  errBox.textContent = '';
  if(!token){
    errBox.textContent = 'Pega un token primero.';
    return;
  }

  try{
    const { data, error } = await sb
      .from('contratos_tokens')
      .select('*')
      .eq('token', token)
      .eq('activo', true);

    if(error){
      errBox.textContent = 'Error consultando contratos_tokens: ' + error.message;
      return;
    }
    if(!data || data.length === 0){
      errBox.textContent = 'Token inválido o inactivo.';
      return;
    }

    const rowToken = data[0];
    ESTADO.token = token;
    ESTADO.tipo = rowToken.tipo === 'admin' ? 'admin' : 'contrato';
    ESTADO.contrato = rowToken.contrato || null;
    ESTADO.nombreDisplay = rowToken.nombre_display || rowToken.contrato || 'Manager';

    document.getElementById('gate').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('whoAmI').textContent =
      ESTADO.tipo === 'admin' ? '👑 Admin' : `👔 ${ESTADO.nombreDisplay}`;

    await iniciarApp();
  }catch(e){
    errBox.textContent = 'Error inesperado: ' + e.message;
  }
}

function cerrarSesion(){
  ESTADO = { token:null, tipo:null, contrato:null, nombreDisplay:null,
    contratosTodos:[], paresSet:new Set(), equivMap:{}, seccionActiva:'pares',
    contratoAbierto:null, periodoActual:null };
  document.getElementById('app').classList.add('hidden');
  document.getElementById('gate').classList.remove('hidden');
  document.getElementById('tokenInput').value = '';
  history.replaceState(null, '', window.location.pathname);
}

// ================================================================
// INICIO DE APP — carga contratos reales + equivalencias
// ================================================================
async function iniciarApp(){
  limpiarErrorGlobal();

  if(ESTADO.tipo === 'admin'){
    document.getElementById('seccionesWrap').classList.remove('hidden');
    await cargarContratosYEquivalencias();
    renderSecciones();
  } else {
    // Manager: va directo a su contrato, sin secciones
    document.getElementById('seccionesWrap').classList.add('hidden');
    await abrirContrato(ESTADO.contrato);
  }
}

async function cargarContratosYEquivalencias(){
  // 1) Contratos reales: distinct 'contrato' desde usuarios_tiktok (fuente de verdad,
  //    no dependemos de que la tabla 'contratos' tenga las filas B-series)
  try{
    const { data, error } = await sb
      .from('usuarios_tiktok')
      .select('contrato')
      .not('contrato', 'is', null);
    if(error) throw error;

    const set = new Set((data||[]).map(r => r.contrato).filter(Boolean));
    ESTADO.contratosTodos = Array.from(set).sort();
  }catch(e){
    mostrarErrorGlobal('No pude leer contratos desde usuarios_tiktok: ' + e.message);
    ESTADO.contratosTodos = [];
  }

  // 2) contratos_equivalencias: introspección de columnas (no asumimos nombres)
  try{
    const { data, error } = await sb.from('contratos_equivalencias').select('*');
    if(error) throw error;

    if(data && data.length){
      const sample = data[0];
      // columnas cuyo valor de muestra parece codigo de contrato (A123 / B123)
      const codeCols = Object.keys(sample).filter(k =>
        /^[AB]\d{2,4}$/i.test(String(sample[k]||''))
      );
      if(codeCols.length >= 2){
        data.forEach(row => {
          const a = row[codeCols[0]];
          const b = row[codeCols[1]];
          if(a && b){
            ESTADO.paresSet.add(a); ESTADO.paresSet.add(b);
            ESTADO.equivMap[a] = b;
            ESTADO.equivMap[b] = a;
          }
        });
      } else {
        mostrarErrorGlobal('contratos_equivalencias respondió pero no pude identificar cuáles columnas traen los códigos A0XX/B0XX. Revisa el nombre de las columnas y avísame.');
      }
    }
  }catch(e){
    mostrarErrorGlobal('No pude leer contratos_equivalencias: ' + e.message + ' (las secciones Pares no van a funcionar hasta resolver esto)');
  }
}

function renderSecciones(){
  const tabs = document.getElementById('sectionTabs');
  tabs.innerHTML = `
    <div class="sectionTab ${ESTADO.seccionActiva==='pares'?'active':''}" onclick="cambiarSeccion('pares')">🔗 Pares</div>
    <div class="sectionTab ${ESTADO.seccionActiva==='nexus'?'active':''}" onclick="cambiarSeccion('nexus')">🅰️ Solo Nexus</div>
    <div class="sectionTab ${ESTADO.seccionActiva==='vertex'?'active':''}" onclick="cambiarSeccion('vertex')">🅱️ Solo Vertex</div>
  `;

  const grid = document.getElementById('contractGrid');
  const todos = ESTADO.contratosTodos;
  let lista = [];

  if(ESTADO.seccionActiva === 'pares'){
    const yaMostrados = new Set();
    todos.forEach(c => {
      if(ESTADO.paresSet.has(c) && !yaMostrados.has(c)){
        const pareja = ESTADO.equivMap[c];
        lista.push(c);
        yaMostrados.add(c);
        if(pareja){ yaMostrados.add(pareja); if(todos.includes(pareja)) lista.push(pareja); }
      }
    });
  } else if(ESTADO.seccionActiva === 'nexus'){
    lista = todos.filter(c => !esSerieB(c) && !ESTADO.paresSet.has(c));
  } else {
    lista = todos.filter(c => esSerieB(c) && !ESTADO.paresSet.has(c));
  }

  if(lista.length === 0){
    grid.innerHTML = `<p class="smallNote">Sin contratos en esta sección.</p>`;
    return;
  }

  grid.innerHTML = lista.map(c => `
    <div class="contractCard" onclick="abrirContrato('${c}')">
      <div class="code">${c}</div>
      <div class="name">${esSerieB(c) ? 'Vertex' : 'Nexus'}${ESTADO.equivMap[c] ? ' · pareja: ' + ESTADO.equivMap[c] : ''}</div>
    </div>
  `).join('');
}

function cambiarSeccion(s){
  ESTADO.seccionActiva = s;
  renderSecciones();
}

function volverASecciones(){
  document.getElementById('contractView').classList.add('hidden');
  if(ESTADO.tipo === 'admin'){
    document.getElementById('seccionesWrap').classList.remove('hidden');
  }
}

// ================================================================
// VISTA DE CONTRATO
// ================================================================
async function abrirContrato(codigo){
  ESTADO.contratoAbierto = codigo;
  document.getElementById('seccionesWrap').classList.add('hidden');
  document.getElementById('contractView').classList.remove('hidden');
  document.getElementById('contractTitle').textContent = codigo;
  document.getElementById('btnVolver').style.display = (ESTADO.tipo === 'admin') ? 'inline-block' : 'none';

  const periodos = await obtenerPeriodosDeContrato(codigo);
  const select = document.getElementById('periodoSelect');

  if(periodos.length === 0){
    select.innerHTML = '<option>Sin periodos</option>';
    document.getElementById('tablaWrap').innerHTML = '<p class="smallNote">Sin datos para este contrato.</p>';
    return;
  }

  select.innerHTML = periodos.map(p =>
    `<option value="${p}">${fmtFecha(p)}${esPeriodoMarcable(p) ? '' : ' (histórico)'}</option>`
  ).join('');

  // default: el más reciente (primero de la lista, ya viene desc)
  select.value = periodos[0];
  await cargarPeriodo(periodos[0]);
}

async function obtenerPeriodosDeContrato(codigo){
  try{
    const { data, error } = await sb
      .from('usuarios_tiktok')
      .select('fecha_periodo, fecha_datos, periodo_archivo')
      .eq('contrato', codigo);
    if(error) throw error;

    const set = new Set();
    (data||[]).forEach(r => {
      const k = periodoKeyDe(r);
      if(k) set.add(k);
    });
    return Array.from(set).sort().reverse(); // más reciente primero
  }catch(e){
    mostrarErrorGlobal('No pude leer periodos de ' + codigo + ': ' + e.message);
    return [];
  }
}

async function cargarPeriodo(periodo){
  ESTADO.periodoActual = periodo;
  const wrap = document.getElementById('tablaWrap');
  wrap.innerHTML = '<p class="loading">Cargando...</p>';

  try{
    // probamos por fecha_periodo primero, si no hay filas probamos fecha_datos
    let { data, error } = await sb
      .from('usuarios_tiktok')
      .select('*')
      .eq('contrato', ESTADO.contratoAbierto)
      .eq('fecha_periodo', periodo);

    if(error) throw error;

    if(!data || data.length === 0){
      const r2 = await sb
        .from('usuarios_tiktok')
        .select('*')
        .eq('contrato', ESTADO.contratoAbierto)
        .eq('fecha_datos', periodo);
      if(r2.error) throw r2.error;
      data = r2.data;
    }

    renderTablaUsuarios(data || [], periodo);
  }catch(e){
    wrap.innerHTML = `<div class="errBox">⚠️ Error cargando el periodo: ${e.message}</div>`;
  }
}

function renderTablaUsuarios(rows, periodo){
  const wrap = document.getElementById('tablaWrap');
  if(rows.length === 0){
    wrap.innerHTML = '<p class="smallNote">Sin jugadores en este periodo.</p>';
    return;
  }

  const marcable = esPeriodoMarcable(periodo);

  const filas = rows.map(r => `
    <tr class="userRow" data-id="${r.id_tiktok}">
      <td onclick="abrirHistorial('${r.id_tiktok}')" style="color:var(--cyan); cursor:pointer; font-weight:bold;">${r.usuario || '(sin nombre)'}</td>
      <td class="smallNote">${r.id_tiktok}</td>
      <td>${r.dias ?? '—'}</td>
      <td>${r.horas ?? '—'}</td>
      <td>${(r.diamantes ?? 0).toLocaleString('es-MX')}</td>
      <td>${r.cumple || '—'}</td>
      <td>${fmtMoney(r.paypal_bruto)}</td>
      <td>${renderToggle(r, 'sueldo', marcable)}</td>
      <td>${renderToggle(r, 'regalo', marcable)}</td>
    </tr>
  `).join('');

  wrap.innerHTML = `
    ${marcable ? '' : '<div class="histBadge" style="margin-bottom:8px;">📜 Periodo histórico — solo lectura, no se puede marcar (regla: pagos válidos desde 2026)</div>'}
    <table>
      <thead>
        <tr>
          <th>Usuario</th><th>ID</th><th>Días</th><th>Horas</th><th>Diamantes</th>
          <th>Cumple</th><th>Sueldo</th><th>Sueldo pagado</th><th>Regalo pagado</th>
        </tr>
      </thead>
      <tbody>${filas}</tbody>
    </table>
  `;
}

function renderToggle(row, campo, marcable){
  const pagado = campo === 'sueldo' ? row.sueldo_pagado : row.regalo_pagado;
  const confirmadoPor = campo === 'sueldo' ? row.confirmado_por_sueldo : row.confirmado_por_regalo;
  const fechaPago = campo === 'sueldo' ? row.fecha_pago_sueldo : row.fecha_pago_regalo;

  if(!marcable){
    return `<span class="payToggle pay-locked">🔒 N/A</span>`;
  }

  const clase = pagado ? 'pay-yes' : 'pay-no';
  const icono = pagado ? '✅' : '⬜';
  const label = pagado ? 'Pagado' : 'No pagado';
  const tip = pagado ? `title="Marcó: ${confirmadoPor || '—'} · ${fmtFecha(fechaPago)}"` : '';

  return `<span class="payToggle ${clase}" ${tip}
            onclick='abrirConfirmacion(${JSON.stringify({id_tiktok:row.id_tiktok, usuario:row.usuario, periodo:ESTADO.periodoActual, campo:campo, valorActual:!!pagado})})'>
            ${icono} ${label}
          </span>`;
}

// ================================================================
// CONFIRMACIÓN DE PAGO (preview + confirmar, con seguro)
// ================================================================
function abrirConfirmacion(payload){
  const nuevoValor = !payload.valorActual;
  const campoLabel = payload.campo === 'sueldo' ? 'SUELDO' : 'REGALO';
  const hoy = new Date().toISOString().slice(0,10);

  const overlay = document.getElementById('modalOverlay');
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <div class="modal">
      <span class="closeX" onclick="cerrarModal()">✕</span>
      <h3>${nuevoValor ? '✅ Marcar como PAGADO' : '⬜ Marcar como NO pagado'}</h3>
      <p>Usuario: <b>${payload.usuario || payload.id_tiktok}</b></p>
      <p>Campo: <b>${campoLabel}</b></p>
      <p>Vas a marcar esto como <b>${nuevoValor ? 'PAGADO' : 'NO PAGADO'}</b>.</p>
      ${nuevoValor ? `
        <label class="smallNote">Fecha de pago:</label><br>
        <input type="date" id="fechaPagoInput" value="${hoy}"
          style="padding:8px; border-radius:6px; border:2px solid var(--border); background:#0a0a0a; color:#fff;">
      ` : ''}
      <div id="modalMsg"></div>
      <div class="modalActions">
        <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
        <button class="btn" onclick="confirmarPago(${JSON.stringify(payload).replace(/"/g,'&quot;')}, ${nuevoValor})">Confirmar</button>
      </div>
    </div>
  `;
}

function cerrarModal(){
  document.getElementById('modalOverlay').classList.add('hidden');
  document.getElementById('modalOverlay').innerHTML = '';
}

async function confirmarPago(payload, nuevoValor){
  const msgBox = document.getElementById('modalMsg');
  msgBox.innerHTML = '<p class="loading">Guardando...</p>';

  const confirmadoPor = ESTADO.tipo === 'admin' ? 'admin' : ESTADO.contrato;
  const fechaInput = document.getElementById('fechaPagoInput');
  const fechaPago = nuevoValor ? (fechaInput ? fechaInput.value : new Date().toISOString().slice(0,10)) : null;

  const campoPagado = payload.campo === 'sueldo' ? 'sueldo_pagado' : 'regalo_pagado';
  const campoFecha  = payload.campo === 'sueldo' ? 'fecha_pago_sueldo' : 'fecha_pago_regalo';
  const campoQuien  = payload.campo === 'sueldo' ? 'confirmado_por_sueldo' : 'confirmado_por_regalo';

  const updateObj = {
    [campoPagado]: nuevoValor,
    [campoFecha]: fechaPago,
    [campoQuien]: nuevoValor ? confirmadoPor : null
  };

  try{
    // Update por id_tiktok + periodo (probamos fecha_periodo, luego fecha_datos)
    let { data, error, count } = await sb
      .from('usuarios_tiktok')
      .update(updateObj)
      .eq('id_tiktok', payload.id_tiktok)
      .eq('fecha_periodo', payload.periodo)
      .select();

    if((!data || data.length === 0) && !error){
      const r2 = await sb
        .from('usuarios_tiktok')
        .update(updateObj)
        .eq('id_tiktok', payload.id_tiktok)
        .eq('fecha_datos', payload.periodo)
        .select();
      data = r2.data; error = r2.error;
    }

    if(error) throw error;
    if(!data || data.length === 0){
      msgBox.innerHTML = '<div class="errBox">⚠️ No se encontró la fila exacta a actualizar (revisa periodo/id_tiktok).</div>';
      return;
    }

    msgBox.innerHTML = '<div class="okBox">✅ Guardado.</div>';
    setTimeout(async () => {
      cerrarModal();
      await cargarPeriodo(ESTADO.periodoActual);
    }, 600);

  }catch(e){
    msgBox.innerHTML = `<div class="errBox">⚠️ Error al guardar: ${e.message}</div>`;
  }
}

// ================================================================
// HISTORIAL POR USUARIO (todas las filas de usuarios_tiktok para ese ID)
// ================================================================
async function abrirHistorial(idTiktok){
  const overlay = document.getElementById('modalOverlay');
  overlay.classList.remove('hidden');
  overlay.innerHTML = `<div class="modal"><span class="closeX" onclick="cerrarModal()">✕</span>
    <h3>📜 Historial — ${idTiktok}</h3><p class="loading">Cargando...</p></div>`;

  try{
    const { data, error } = await sb
      .from('usuarios_tiktok')
      .select('*')
      .eq('id_tiktok', idTiktok);
    if(error) throw error;

    const filas = (data||[])
      .sort((a,b) => (periodoKeyDe(b)||'').localeCompare(periodoKeyDe(a)||''))
      .map(r => `
        <tr>
          <td>${fmtFecha(periodoKeyDe(r))}</td>
          <td>${r.contrato || '—'}</td>
          <td>${r.usuario || '—'}</td>
          <td>${r.dias ?? '—'}</td>
          <td>${r.horas ?? '—'}</td>
          <td>${(r.diamantes ?? 0).toLocaleString('es-MX')}</td>
          <td>${fmtMoney(r.paypal_bruto)}</td>
          <td>${r.sueldo_pagado ? '✅ '+(r.confirmado_por_sueldo||'') : (esPeriodoMarcable(periodoKeyDe(r)) ? '⬜' : '🔒')}</td>
          <td>${r.regalo_pagado ? '✅ '+(r.confirmado_por_regalo||'') : (esPeriodoMarcable(periodoKeyDe(r)) ? '⬜' : '🔒')}</td>
        </tr>
      `).join('');

    document.getElementById('modalOverlay').innerHTML = `
      <div class="modal">
        <span class="closeX" onclick="cerrarModal()">✕</span>
        <h3>📜 Historial completo — ${idTiktok}</h3>
        ${filas ? `
          <table>
            <thead><tr>
              <th>Periodo</th><th>Contrato</th><th>Usuario</th><th>Días</th><th>Horas</th>
              <th>Diamantes</th><th>Sueldo</th><th>Sueldo pag.</th><th>Regalo pag.</th>
            </tr></thead>
            <tbody>${filas}</tbody>
          </table>
        ` : '<p class="smallNote">Sin historial.</p>'}
      </div>
    `;
  }catch(e){
    document.getElementById('modalOverlay').innerHTML =
      `<div class="modal"><span class="closeX" onclick="cerrarModal()">✕</span>
       <div class="errBox">⚠️ Error cargando historial: ${e.message}</div></div>`;
  }
}

// ================================================================
// BÚSQUEDA UNIVERSAL (ID o usuario, cualquier serie, cualquier periodo)
// ================================================================
let searchTimeout = null;
document.addEventListener('input', (e) => {
  if(e.target.id === 'searchInput'){
    clearTimeout(searchTimeout);
    const q = e.target.value.trim();
    if(q.length < 2){
      document.getElementById('searchResults').classList.add('hidden');
      return;
    }
    searchTimeout = setTimeout(() => buscarUsuario(q), 350);
  }
});

document.addEventListener('click', (e) => {
  if(!document.getElementById('searchBox').contains(e.target)){
    document.getElementById('searchResults').classList.add('hidden');
  }
});

async function buscarUsuario(q){
  const resultsBox = document.getElementById('searchResults');
  resultsBox.classList.remove('hidden');
  resultsBox.innerHTML = '<div class="searchItem loading">Buscando...</div>';

  try{
    let query = sb.from('usuarios_tiktok').select('*');

    // Si parece ID numérico largo, busca exacto; si no, busca por usuario (ilike)
    if(/^\d{6,}$/.test(q)){
      query = query.eq('id_tiktok', q);
    } else {
      query = query.ilike('usuario', `%${q}%`);
    }

    // Si es manager, restringir a su propio contrato
    if(ESTADO.tipo !== 'admin' && ESTADO.contrato){
      query = query.eq('contrato', ESTADO.contrato);
    }

    const { data, error } = await query.limit(200);
    if(error) throw error;

    if(!data || data.length === 0){
      resultsBox.innerHTML = '<div class="searchItem">Sin resultados.</div>';
      return;
    }

    // Agrupar por id_tiktok, quedarnos con la fila más reciente de cada uno
    const porId = {};
    data.forEach(r => {
      const k = r.id_tiktok;
      const pk = periodoKeyDe(r) || '';
      if(!porId[k] || pk > (periodoKeyDe(porId[k]) || '')){
        porId[k] = r;
      }
    });

    // ¿Aparece en el periodo más reciente de SU contrato? (para avisar "no aparece en mes actual")
    const items = await Promise.all(Object.values(porId).map(async (r) => {
      const periodosContrato = await obtenerPeriodosDeContrato(r.contrato);
      const masReciente = periodosContrato[0];
      const apareceEnActual = masReciente && (periodoKeyDe(r) === masReciente);
      return { row:r, apareceEnActual, masReciente };
    }));

    resultsBox.innerHTML = items.map(it => `
      <div class="searchItem" onclick='seleccionarDeBusqueda(${JSON.stringify({contrato:it.row.contrato, periodo:periodoKeyDe(it.row), id_tiktok:it.row.id_tiktok}).replace(/"/g,'&quot;')})'>
        <b>${it.row.usuario || '(sin nombre)'}</b> — ${it.row.contrato} — ${it.row.id_tiktok}
        <div class="meta">
          Último periodo visto: ${fmtFecha(periodoKeyDe(it.row))}
          ${it.apareceEnActual ? '' : `<span class="badge-noshow">· No aparece en el mes actual de su contrato (${fmtFecha(it.masReciente)})</span>`}
        </div>
      </div>
    `).join('');

  }catch(e){
    resultsBox.innerHTML = `<div class="searchItem">⚠️ Error buscando: ${e.message}</div>`;
  }
}

async function seleccionarDeBusqueda(sel){
  document.getElementById('searchResults').classList.add('hidden');
  document.getElementById('searchInput').value = '';

  if(ESTADO.tipo === 'admin'){
    await abrirContrato(sel.contrato);
    // seleccionar el periodo donde efectivamente se encontró (puede no ser el más reciente)
    const select = document.getElementById('periodoSelect');
    if([...select.options].some(o => o.value === sel.periodo)){
      select.value = sel.periodo;
      await cargarPeriodo(sel.periodo);
    }
  } else {
    await cargarPeriodo(sel.periodo);
  }

  // abrir directo el historial de ese usuario para contexto inmediato
  setTimeout(() => abrirHistorial(sel.id_tiktok), 300);
}
</script>
